function defaultState(){return {page:'today',selectedDay:new Date().getDay(),charTabs:{hutao:'build',yelan:'build',nicole:'build',citlali:'build'},materials:{},wish:{primos:0,fates:0,charPity:53,charGuaranteed:false,charsNeeded:3,weaponPity:3,weaponsNeeded:4},daily:{date:'',welkin:false,comm:false,hoyo:false},recurring:{},backlog:{}}}

Object.keys(mats).forEach(id=>{if(s.materials[id]==null)s.materials[id]=0});
function todayKey(){return new Date().toDateString()}
function resetDailyIfNeeded(){if(s.daily.date!==todayKey())s.daily={date:todayKey(),welkin:false,comm:false,hoyo:false}}

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function remain(id){return Math.max(0,mats[id].need-(+s.materials[id]||0))}
function pct(ids){if(!ids.length)return 100;let n=ids.reduce((a,id)=>a+mats[id].need,0),v=ids.reduce((a,id)=>a+Math.min(mats[id].need,+s.materials[id]||0),0);return n?Math.round(v/n*100):100}
function charAllIds(c){return [...c.groups.character,...c.groups.talents,...c.groups.weapon]}
function domainTasks(day){let groups={};Object.entries(mats).forEach(([id,m])=>{if(!m.domain||remain(id)<=0||!m.days.includes(day))return;let key=m.source+'|'+m.owner;if(!groups[key])groups[key]={domain:m.source,owner:m.owner,ids:[]};groups[key].ids.push(id)});return Object.values(groups)}
function elClass(el){return el.toLowerCase()}
function renderNav(){document.querySelectorAll('#mainNav button').forEach(b=>b.classList.toggle('on',b.dataset.page===s.page));document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id===s.page))}

function bindMatButtons(root=document){root.querySelectorAll('[data-mat]').forEach(b=>b.onclick=()=>{let id=b.dataset.mat,d=+b.dataset.d;s.materials[id]=clamp((+s.materials[id]||0)+d,0,mats[id].need);save();renderAll()})}
function renderToday(){let day=new Date().getDay(),tasks=domainTasks(day);let dailyCount=(s.daily.welkin?90:0)+(s.daily.comm?60:0);let taskHtml=tasks.length?tasks.map(t=>{let c=chars[t.owner],r=t.ids.reduce((a,id)=>a+remain(id),0);return `<div class="task"><div class="taskhead"><div><b>${t.domain}</b><div class="muted" style="font-size:10px">${c.name} • ${r} tracked pieces remaining</div></div><span class="pill ${elClass(c.element)}">${c.element}</span></div><div class="tags">${t.ids.map(id=>`<span class="tag">${mats[id].name}: ${remain(id)}</span>`).join('')}</div></div>`}).join(''):`<div class="save-resin"><b>SAVE RESIN</b><span class="muted">No unfinished scheduled material is available today.</span></div>`;let progress=Object.entries(chars).map(([id,c])=>{let p=pct(charAllIds(c));return `<div class="progressline"><span>${c.name}</span><b class="${p===100?'good':''}">${p}%</b></div><div class="bar"><i style="width:${p}%"></i></div>`}).join('');document.getElementById('today').innerHTML=`<div class="card hero"><div class="eyebrow">TODAY</div><div class="title">${dayNames[day]}</div><div class="muted">Your domain list updates automatically from unfinished character materials.</div></div><div class="card"><div class="eyebrow">RESIN PLAN</div>${taskHtml}</div><div class="card"><div class="eyebrow">DAILY PRIMOS</div><div class="big">${dailyCount} <span class="muted" style="font-size:12px">/ 150 guaranteed</span></div><div class="checkrow"><input type="checkbox" id="dWelkin" ${s.daily.welkin?'checked':''}><label for="dWelkin"><b>Welkin Moon</b><small>90 primogems</small></label></div><div class="checkrow"><input type="checkbox" id="dComm" ${s.daily.comm?'checked':''}><label for="dComm"><b>Daily Commissions</b><small>60 primogems</small></label></div><div class="checkrow"><input type="checkbox" id="dHoyo" ${s.daily.hoyo?'checked':''}><label for="dHoyo"><b>HoYoLAB Check-In</b><small>Primogems on reward days</small></label></div></div><div class="card"><div class="eyebrow">BUILD PROGRESS</div>${progress}</div>`;['Welkin','Comm','Hoyo'].forEach(k=>{let e=document.getElementById('d'+k);e.onchange=()=>{s.daily[k.toLowerCase()]=e.checked;save();renderToday()}})}
function renderDomains(){let d=s.selectedDay,tasks=domainTasks(d);let list=tasks.length?tasks.map(t=>{let c=chars[t.owner];return `<div class="task"><div class="taskhead"><div><b>${t.domain}</b><div class="muted" style="font-size:10px">${c.name}</div></div><span class="pill ${elClass(c.element)}">${c.element}</span></div>${t.ids.map(materialRow).join('')}</div>`}).join(''):`<div class="save-resin"><b>SAVE RESIN</b><span class="muted">Everything farmable on ${dayNames[d]} is finished.</span></div>`;let schedule=[1,2,3,4,5,6,0].map(day=>`<div class="row"><div class="left"><b>${dayNames[day]}</b><small>${domainTasks(day).length?domainTasks(day).map(x=>x.domain).filter((v,i,a)=>a.indexOf(v)===i).join(' • '):'Save Resin'}</small></div><span class="pill">${domainTasks(day).length} task${domainTasks(day).length===1?'':'s'}</span></div>`).join('');document.getElementById('domains').innerHTML=`<div class="card hero"><div class="eyebrow">DOMAIN PLANNER</div><div class="title">${dayNames[d]}</div><div class="muted">Finishing a material on a character page removes it here automatically.</div></div><div class="card"><div class="weekdays">${shortDays.map((n,i)=>`<button data-day="${i}" class="${i===d?'on':''}">${n}</button>`).join('')}</div></div><div class="card"><div class="eyebrow">FARM THIS DAY</div>${list}</div><div class="card"><div class="eyebrow">WEEK AT A GLANCE</div>${schedule}</div>`;document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{s.selectedDay=+b.dataset.day;save();renderDomains()});bindMatButtons(document.getElementById('domains'))}
function characterSection(c,id,tab){if(tab==='build')return `<div class="card"><div class="buildline"><b>Best artifact set</b><span>${c.artifact}</span><div class="matsource">Farm: ${c.artifactDomain}</div></div><div class="buildline"><b>Main stats</b>${c.mainStats.map(x=>`<div class="muted" style="margin:4px 0">${x}</div>`).join('')}</div><div class="buildline"><b>Substat priority</b><span>${c.substats}</span></div><div class="buildline"><b>Main weapon options</b><div class="weapon-list">${c.weapons.map(w=>`<span>${w}</span>`).join('')}</div></div><div class="buildline"><b>Talent priority</b><span>${c.talentNote}</span></div></div>`;let ids=c.groups[tab]||[];if(!ids.length)return `<div class="card"><div class="complete-note">✓ Already complete</div><div class="muted" style="text-align:center">${c.talentNote}</div></div>`;return `<div class="card">${ids.map(materialRow).join('')}</div>`}
function renderChar(id){let c=chars[id],tab=s.charTabs[id]||'build',p=pct(charAllIds(c));document.getElementById(id).innerHTML=`<div class="card hero"><div class="taskhead"><div><div class="eyebrow">${c.owned?'OWNED':'TARGET CHARACTER'}</div><div class="title">${c.name}</div><div class="muted">${c.role}</div></div><span class="pill ${elClass(c.element)}">${c.element}</span></div><div class="bar"><i style="width:${p}%"></i></div><div class="muted" style="font-size:10px;margin-top:5px">Tracked farming progress ${p}%</div></div><div class="subtabs">${['build','character','talents','weapon'].map(x=>`<button data-char-tab="${x}" class="${tab===x?'on':''}">${x.toUpperCase()}</button>`).join('')}</div>${characterSection(c,id,tab)}`;document.getElementById(id).querySelectorAll('[data-char-tab]').forEach(b=>b.onclick=()=>{s.charTabs[id]=b.dataset.charTab;save();renderChar(id)});bindMatButtons(document.getElementById(id))}
function wishCalc(){let w=s.wish,available=Math.floor(Math.max(0,w.primos)/160)+Math.max(0,w.fates),cn=Math.max(0,Math.floor(w.charsNeeded)),wn=Math.max(0,Math.floor(w.weaponsNeeded));let cWorst=cn?Math.max(0,90-clamp(w.charPity,0,89))+(w.charGuaranteed?0:90)+Math.max(0,cn-1)*180:0;let wWorst=wn?Math.max(0,80-clamp(w.weaponPity,0,79))+80+Math.max(0,wn-1)*160:0;let total=cWorst+wWorst;return {available,cWorst,wWorst,total,missing:Math.max(0,total-available),primoEq:Math.max(0,total-available)*160}}
function renderWishes(){let w=s.wish,x=wishCalc(),p=x.total?Math.min(100,Math.round(x.available/x.total*100)):100;document.getElementById('wishes').innerHTML=`<div class="card hero"><div class="eyebrow">WISH SAVINGS</div><div class="title">Worst-case fortress</div><div class="big">${x.available} <span class="muted" style="font-size:12px">pulls saved</span></div><div class="bar"><i style="width:${p}%"></i></div><div class="muted" style="font-size:10px;margin-top:5px">${p}% of your current worst-case target</div></div><div class="card"><div class="eyebrow">BANK</div><div class="wishinput"><span>Primogems</span><input id="wPrimos" type="number" min="0" value="${w.primos}"></div><div class="wishinput"><span>Intertwined Fates</span><input id="wFates" type="number" min="0" value="${w.fates}"></div></div><div class="card"><div class="eyebrow">CHARACTERS</div><div class="targets"><span class="tag">Yelan</span><span class="tag">Nicole</span><span class="tag">Citlali</span></div><div class="wishinput"><span>Characters needed</span><input id="wChars" type="number" min="0" value="${w.charsNeeded}"></div><div class="wishinput"><span>Current pity</span><input id="wCPity" type="number" min="0" max="89" value="${w.charPity}"></div><div class="row"><div class="left"><b>Current state</b><small>Character guarantee carries between Character Event Wishes.</small></div><button id="wGuarantee">${w.charGuaranteed?'GUARANTEED':'50/50'}</button></div><div class="grid2"><div class="metric">WORST CASE<b>${x.cWorst}</b></div><div class="metric">CURRENT PITY<b>${w.charPity}</b></div></div></div><div class="card"><div class="eyebrow">WEAPONS</div><div class="targets"><span class="tag">Staff of Homa</span><span class="tag">Aqua Simulacra</span><span class="tag">Angelos’ Heptades</span><span class="tag">Starcaller’s Watch</span></div><div class="wishinput"><span>Weapons needed</span><input id="wWeapons" type="number" min="0" value="${w.weaponsNeeded}"></div><div class="wishinput"><span>Weapon pity</span><input id="wWPity" type="number" min="0" max="79" value="${w.weaponPity}"></div><div class="muted" style="font-size:10px">Weapon pity carries. Epitomized Path Fate Points do not carry to a new weapon banner, so this calculator assumes 0 Fate Points for each future target.</div><div class="metric" style="margin-top:9px">WEAPON WORST CASE<b>${x.wWorst}</b></div></div><div class="card"><div class="eyebrow">TOTAL TARGET</div><div class="grid2"><div class="metric">MAX PULLS<b>${x.total}</b></div><div class="metric">MISSING<b>${x.missing}</b></div></div><div class="big" style="margin-top:12px">${x.primoEq.toLocaleString()} <span class="muted" style="font-size:12px">primos still needed</span></div></div>`;const inputs=[['wPrimos','primos',99999999],['wFates','fates',99999],['wChars','charsNeeded',20],['wCPity','charPity',89],['wWeapons','weaponsNeeded',20],['wWPity','weaponPity',79]];inputs.forEach(([id,k,max])=>{let e=document.getElementById(id);e.onchange=()=>{s.wish[k]=clamp(Math.floor(+e.value||0),0,max);save();renderWishes()}});document.getElementById('wGuarantee').onclick=()=>{s.wish.charGuaranteed=!s.wish.charGuaranteed;save();renderWishes()}}
function renderPrimos(){document.getElementById('primos').innerHTML=`<div class="card hero"><div class="eyebrow">PRIMOGEM CHECKLIST</div><div class="title">Strip the map for pulls</div><div class="muted">Guaranteed daily baseline with Welkin + Commissions: 150 primos/day, or 4,500 over 30 days.</div></div><div class="card"><div class="eyebrow">RECURRING</div>${recurring.map(x=>`<div class="checkrow"><input type="checkbox" id="r_${x.id}" data-rec="${x.id}" ${s.recurring[x.id]?'checked':''}><label for="r_${x.id}"><b>${x.name}</b><small>${x.reward}</small></label></div>`).join('')}</div><div class="card"><div class="eyebrow">PERMANENT BACKLOG</div>${backlog.map(x=>`<div class="checkrow"><input type="checkbox" id="b_${x[0]}" data-back="${x[0]}" ${s.backlog[x[0]]?'checked':''}><label for="b_${x[0]}"><b>${x[1]}</b><small>${x[2]}</small></label></div>`).join('')}</div><div class="card"><div class="eyebrow">ACCOUNT SNAPSHOT</div><div class="row"><div class="left"><b>Adventure Rank</b><small>58</small></div><span class="pill">AR 58</span></div><div class="row"><div class="left"><b>Achievements</b><small>919 completed</small></div><span class="pill">919 / 1,758</span></div><div class="row"><div class="left"><b>Serenitea Trust</b><small>Maxed</small></div><span class="pill good">MAX</span></div><div class="row"><div class="left"><b>TCG</b><small>Excluded from this tracker</small></div><span class="pill">IGNORE</span></div></div><button class="reset" id="resetAll">RESET REBOOT DATA</button>`;document.querySelectorAll('[data-rec]').forEach(e=>e.onchange=()=>{s.recurring[e.dataset.rec]=e.checked;save()});document.querySelectorAll('[data-back]').forEach(e=>e.onchange=()=>{s.backlog[e.dataset.back]=e.checked;save()});document.getElementById('resetAll').onclick=()=>{if(confirm('Reset all L.U.N.A.R. reboot progress?')){localStorage.removeItem(KEY);s=defaultState();Object.keys(mats).forEach(id=>s.materials[id]=0);resetDailyIfNeeded();save();renderAll()}}}
function renderAll(){resetDailyIfNeeded();renderToday();renderDomains();renderWishes();renderPrimos();Object.keys(chars).forEach(renderChar);renderNav();save()}
document.querySelectorAll('#mainNav [data-page]').forEach(b=>b.onclick=()=>{s.page=b.dataset.page;renderNav();save();document.getElementById(s.page).scrollTop=0});
resetDailyIfNeeded();renderAll();
</script>
</body>
</html>
