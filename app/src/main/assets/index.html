<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080910">
<title>L.U.N.A.R.</title>
<style>
:root{
  color-scheme:dark;
  --bg:#080910;
  --panel:#10131c;
  --panel2:#141824;
  --line:#252a39;
  --text:#f5f6fb;
  --muted:#8d94a8;
  --accent:#a6afff;
  --accent2:#dfe2ff;
  --good:#79e6ae;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{
  display:flex;
  justify-content:center;
  background:
    radial-gradient(circle at 50% -8%,rgba(108,117,190,.20),transparent 31rem),
    var(--bg);
}
button,input{font:inherit}
.app{
  width:100%;
  max-width:520px;
  min-height:100vh;
  padding:calc(env(safe-area-inset-top) + 24px) 16px calc(env(safe-area-inset-bottom) + 24px);
}
header{text-align:center;padding:6px 0 25px}
.moon{font-size:29px;line-height:1;margin-bottom:9px;color:var(--accent2)}
h1{margin:0;font-size:25px;letter-spacing:.36em;padding-left:.36em;font-weight:760}
.tag{margin-top:7px;color:var(--muted);font-size:10px;letter-spacing:.17em;text-transform:uppercase}

.card{
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line);
  border-radius:21px;
  padding:19px;
  margin:12px 0;
  box-shadow:0 14px 38px rgba(0,0,0,.16);
}
.label{color:var(--muted);font-size:10px;letter-spacing:.16em;text-transform:uppercase}
.currentRow{display:flex;align-items:center;gap:11px;margin-top:10px}
.gem{font-size:22px;color:var(--accent2)}
#currentInput{
  width:100%;
  min-width:0;
  border:0;
  outline:0;
  padding:0;
  background:transparent;
  color:var(--text);
  font-size:38px;
  line-height:1.15;
  font-weight:800;
  caret-color:var(--accent);
}
#currentInput::placeholder{color:#4e5569}
.hint{margin-top:8px;color:var(--muted);font-size:11px}

.goalTop{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:10px}
.value{font-size:25px;font-weight:800;line-height:1}
.target{color:var(--muted);font-size:12px;white-space:nowrap}
.bar{height:10px;margin-top:15px;background:#090b11;border:1px solid #202431;border-radius:99px;overflow:hidden}
.fill{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .25s ease}
.meta{display:flex;justify-content:space-between;gap:10px;margin-top:9px;color:var(--muted);font-size:11px}
.complete{color:var(--good)}
.note{text-align:center;color:#6f768b;font-size:10px;line-height:1.5;margin:16px 8px 0}
.reset{
  display:block;
  margin:8px auto 0;
  border:0;
  background:none;
  color:#777f96;
  padding:7px 10px;
  font-size:10px;
  text-decoration:underline;
  text-underline-offset:3px;
}
.reset:active{opacity:.65}

@media(max-width:360px){
  #currentInput{font-size:33px}
  .value{font-size:22px}
}
</style>
</head>
<body>
<main class="app">
  <header>
    <div class="moon">☾</div>
    <h1>L.U.N.A.R.</h1>
    <div class="tag">Primogem saving tracker</div>
  </header>

  <section class="card">
    <div class="label">Current Primogems</div>
    <div class="currentRow">
      <div class="gem">✦</div>
      <input id="currentInput" type="number" min="0" step="1" inputmode="numeric" placeholder="0" aria-label="Current Primogems">
    </div>
    <div class="hint">This is the only number you update.</div>
  </section>

  <section class="card">
    <div class="label">Weekly Goal</div>
    <div class="goalTop">
      <div class="value" id="weeklyValue">0</div>
      <div class="target">/ 1,600</div>
    </div>
    <div class="bar"><i class="fill" id="weeklyBar"></i></div>
    <div class="meta">
      <span id="weeklyPct">0%</span>
      <span id="weeklyLeft">1,600 left</span>
    </div>
  </section>

  <section class="card">
    <div class="label">Grand Goal</div>
    <div class="goalTop">
      <div class="value" id="grandValue">0</div>
      <div class="target">/ 200,000</div>
    </div>
    <div class="bar"><i class="fill" id="grandBar"></i></div>
    <div class="meta">
      <span id="grandPct">0%</span>
      <span id="grandLeft">200,000 left</span>
    </div>
  </section>

  <div class="note" id="weekNote"></div>
  <button class="reset" id="resetWeek" type="button">Reset weekly starting point</button>
</main>
<script src="app.js"></script>
</body>
</html>
