<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b12">
<title>L.U.N.A.R.</title>
<style>
:root{color-scheme:dark;--bg:#090b12;--panel:#111520;--line:#272e3e;--text:#f4f6ff;--muted:#969db0;--accent:#9ca7ff;--good:#76e6aa;--warn:#ffd27c}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}body{display:flex;justify-content:center}.app{width:100%;max-width:480px;min-height:100%;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}header{padding:28px 4px 20px}h1{margin:0;font-size:25px;letter-spacing:.24em}.sub{margin-top:5px;color:var(--muted);font-size:10px;letter-spacing:.15em}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0}.eyebrow{color:var(--muted);font-size:10px;letter-spacing:.15em;text-transform:uppercase}.big{font-size:28px;font-weight:850;margin-top:5px}.muted{color:var(--muted);font-size:11px;margin-top:4px}.bar{height:9px;background:#080a10;border-radius:99px;overflow:hidden;margin:14px 0 6px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#9ca7ff,#6de3ff);transition:width .25s}.percent{font-size:11px;color:var(--muted);text-align:right}.goal{font-size:20px;font-weight:800;margin-top:5px}input{width:100%;height:50px;margin-top:10px;border:1px solid #394158;border-radius:13px;background:#090c13;color:white;padding:0 13px;font-size:18px;outline:none}button{width:100%;min-height:46px;margin-top:10px;border:1px solid #394158;border-radius:13px;background:#171d2d;color:white;font-weight:750}button:active{transform:scale(.98)}.good{color:var(--good)}.warn{color:var(--warn)}.split{display:grid;grid-template-columns:1fr 1fr;gap:9px}.split button{margin-top:0}.footer{color:#666d80;font-size:10px;text-align:center;margin:25px 0}.danger{background:#171218;border-color:#3d2b36;color:#d9aabb}
</style>
</head>
<body>
<main class="app">
<header><h1>L.U.N.A.R.</h1><div class="sub">PRIMOGEM SAVING TRACKER</div></header>
<section class="card">
  <div class="eyebrow">Weekly goal</div>
  <div class="goal">1,600 Primogems</div>
  <div class="big" id="weeklyValue">0 / 1,600</div>
  <div class="bar"><i id="weeklyBar"></i></div>
  <div class="percent" id="weeklyPct">0%</div>
  <div class="muted" id="weeklyStatus">1,600 primogems to go</div>
  <input id="weeklyInput" type="number" min="0" step="1" inputmode="numeric" placeholder="Primogems earned this week">
  <div class="split"><button id="addWeekly">+160</button><button id="resetWeekly">Reset week</button></div>
</section>
<section class="card">
  <div class="eyebrow">Long-term goal</div>
  <div class="goal">200,000 Primogems</div>
  <div class="big" id="primoValue">0</div>
  <div class="bar"><i id="totalBar"></i></div>
  <div class="percent" id="totalPct">0%</div>
  <div class="muted" id="totalStatus">200,000 primogems to go</div>
</section>
<section class="card">
  <div class="eyebrow">Current primogems</div>
  <div class="muted">Type the amount you have right now.</div>
  <input id="currentInput" type="number" min="0" step="1" inputmode="numeric" placeholder="e.g. 12540">
</section>
<section class="card">
  <div class="eyebrow">Reset</div>
  <button class="danger" id="clearAll">Clear L.U.N.A.R. data</button>
</section>
<div class="footer">1 wish = 160 Primogems · data stays on this device</div>
</main>
<script src="app.js"></script>
</body>
</html>
